# Render Blueprint — free-tier API hosting (see docs/FREE_DEPLOY.md).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for on first deploy.
services:
  - type: web
    name: forum500-api
    runtime: docker
    plan: free
    rootDir: backends
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backends/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 60d
      # Neon connection string (direct, not "-pooler"), ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # https://<web>.vercel.app,https://<admin>.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # https://forum500-api.onrender.com
      - key: PUBLIC_API_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      # Cloudflare R2 (S3-compatible, free 10 GB)
      - key: STORAGE_DRIVER
        value: s3
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        value: forum500-uploads
      # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # https://pub-xxxx.r2.dev (bucket → Settings → Public access)
      - key: ASSET_PUBLIC_BASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Emails are printed to the Render log until a real mail provider is added.
      - key: MAIL_DRIVER
        value: log
