# AWS Amplify Hosting build spec (Next.js SSR). In the Amplify console:
# App settings → Monorepo → app root = frontends/admin ; env var NEXT_PUBLIC_API_URL=https://api.forum500.club/api
version: 1
applications:
  - appRoot: frontends/admin
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || true
            - npm ci
        build:
          commands:
            - npx tsc --noEmit
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
