name: Frontend (web) — CI

# AWS Amplify Hosting deploys this app from the Git integration (see frontends/web/amplify.yml)
# (monorepo app root = frontends/web; Amplify only rebuilds when files there change).
# This workflow type-checks and builds every PR.
# Automatic runs paused 2026-10-24 (failure emails; no deploy target yet). Run manually from the Actions tab.
# To restore, bring back the push/pull_request triggers from git history.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: frontends/web

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.forum500.club/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontends/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
