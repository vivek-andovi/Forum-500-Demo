name: Backend — CI & Deploy to AWS ECS

on:
  push:
    branches: [main, develop]
    paths: ['backends/**', 'infra/aws/ecs-task-definition.json', '.github/workflows/backend-ci-deploy.yml']
  pull_request:
    paths: ['backends/**']
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → AWS (no long-lived AWS keys in GitHub)
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: forum500-api
  ECS_CLUSTER: forum500
  ECS_SERVICE: ${{ github.ref_name == 'main' && 'forum500-api-prod' || 'forum500-api-staging' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backends } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: forum500, POSTGRES_PASSWORD: forum500, POSTGRES_DB: forum500 }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://forum500:forum500@localhost:5432/forum500?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backends/package-lock.json }
      - run: npm ci
      - run: npm run check:types
      - run: npm run check:layers
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      # Remaining known advisories are in the Prisma CLI config loader (fixed in Prisma 7);
      # see docs/SECURITY.md. Make this blocking after the Prisma 7 upgrade.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build & push image (arm64 for Fargate Graviton)
        id: image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker buildx build --platform linux/arm64 -t "$IMAGE" --push backends
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Render task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs-task-definition.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}
      - name: Deploy to ECS (migrations run on container start)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
