name: Backend — CI & Deploy to AWS ECS

on:
  push:
    branches: [main, develop]
    paths: ['backends/**', '.github/workflows/backend-ci-deploy.yml']
  pull_request:
    paths: ['backends/**']
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → AWS (no long-lived AWS keys in GitHub)
  contents: read

# Names match infra/terraform (forum500-<environment>-…).
env:
  AWS_REGION: eu-west-2
  TF_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backends } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: forum500, POSTGRES_PASSWORD: forum500, POSTGRES_DB: forum500 }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://forum500:forum500@localhost:5432/forum500?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backends/package-lock.json }
      - run: npm ci
      - run: npm run check:types
      - run: npm run check:layers
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      # API tests against the freshly seeded throwaway database (see test/api.e2e.test.mjs).
      - name: End-to-end API tests
        env: { PORT: '4100', API_URL: 'http://localhost:4100/api' }
        run: |
          node dist/main > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$API_URL/health" >/dev/null && break; sleep 1; done
          npm run test:e2e || (cat api.log; exit 1)
      # Remaining known advisories are in the Prisma CLI config loader (fixed in Prisma 7);
      # see docs/SECURITY.md. Make this blocking after the Prisma 7 upgrade.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve resource names
        run: |
          echo "ECR_REPOSITORY=forum500-${TF_ENV}-api" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=forum500-${TF_ENV}" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=forum500-${TF_ENV}-api" >> "$GITHUB_ENV"
          echo "TASK_FAMILY=forum500-${TF_ENV}-api" >> "$GITHUB_ENV"
      - name: Build & push image (arm64 for Fargate Graviton)
        id: image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}
          docker buildx build --platform linux/arm64 -t "$IMAGE" --push backends
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
      # Terraform owns the task definition (env, secrets, roles); CI only swaps the image.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' > taskdef.json
      - name: Render task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}
      - name: Deploy to ECS (migrations run on container start)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
