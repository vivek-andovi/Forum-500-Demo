name: Infrastructure — Terraform checks

# Runs offline checks on every infra change (no AWS credentials needed):
# formatting, validation, and mocked plans for staging + production (tests/plan.tftest.hcl).
on:
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/infra-terraform.yml']
  push:
    branches: [main, develop]
    paths: ['infra/terraform/**']

defaults:
  run:
    working-directory: infra/terraform

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -recursive -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - name: Validate bootstrap stack
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
