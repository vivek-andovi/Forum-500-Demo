name: Infrastructure — Terraform checks

# Runs offline checks on every infra change (no AWS credentials needed):
# formatting, validation, and mocked plans for staging + production (tests/plan.tftest.hcl).
# Automatic runs paused 2026-10-24 (failure emails; no deploy target yet). Run manually from the Actions tab.
# To restore, bring back the push/pull_request triggers from git history.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: infra/terraform

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -recursive -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - name: Validate bootstrap stack
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
